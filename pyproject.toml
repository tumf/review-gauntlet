[project]
name = "review-gauntlet"
version = "0.1.0"
description = "Coverage-driven review gauntlet for agentic code reviews"
readme = "README.md"
authors = [
    { name = "tumf", email = "tumf@users.noreply.github.com" }
]
license = "MIT"
requires-python = ">=3.11"
keywords = ["agentic", "code-review", "coverage", "review", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
]

[project.optional-dependencies]
tui = [
    "rich>=13",
    "textual>=0.89",
]

[project.urls]
Repository = "https://github.com/tumf/review-gauntlet"
Issues = "https://github.com/tumf/review-gauntlet/issues"

[project.scripts]
review-gauntlet = "review_gauntlet.cli:main"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bump-my-version>=1.2.4",
    "prek>=0.4.4",
    "pyright>=1.1.410",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.16",
]

[tool.bumpversion]
current_version = "0.1.0"
tag = false
sign_tags = false
allow_dirty = true
commit = false
message = "Bump version: {current_version} → {new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"

[[tool.bumpversion.files]]
filename = "src/review_gauntlet/__about__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
